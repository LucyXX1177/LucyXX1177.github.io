<section class="card border-0 shadow-sm bg-white mt-3" aria-labelledby="education-title">
  <div class="card-body p-4">
    <h2 class="h5 mb-3" id="education-title">Education</h2>
    {% for item in site.data.profile.education %}
    <div class="{% unless forloop.last %}mb-4{% endunless %}">
      <div class="d-flex flex-wrap justify-content-between"><strong>{{ item.name }}</strong><span class="small text-muted">{{ item.date }}</span></div>
      <div>{{ item.position }}</div>
      <div class="small text-muted">{{ item.details }}</div>
      <div class="small mt-1">Coursework: {{ item.coursework }}</div>
    </div>
    {% endfor %}
    <h2 class="h5 mt-4 mb-3">Honors &amp; Awards</h2>
    <ul class="list-unstyled mb-0">{% for item in site.data.profile.awards %}
      <li class="d-flex flex-wrap justify-content-between mb-2"><span>{{ item.name }}</span><span class="small text-muted">{{ item.date }}</span></li>
    {% endfor %}</ul>
  </div>
</section>
