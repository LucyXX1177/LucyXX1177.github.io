<section class="card border-0 shadow-sm bg-white" aria-labelledby="about-title">
  <div class="card-body p-4">
    <h2 class="h5 mb-3" id="about-title">About Me</h2>
    <div class="text-profile-bio" {% if site.data.profile.short_bio_text_justify %}style="text-align: justify;"{% endif %}>
      {{ site.data.profile.short_bio }}
    </div>
    <div class="bio-actions mt-4">
      {% if site.data.profile.cv_link %}
      <a target="_blank" rel="noopener noreferrer" href="{{ site.data.profile.cv_link | relative_url }}">Curriculum Vitae <span aria-hidden="true">&nearr;</span></a>
      {% endif %}
      <a href="{{ '/research.html' | relative_url }}">Research experience <span aria-hidden="true">&rarr;</span></a>
    </div>
  </div>
</section>
