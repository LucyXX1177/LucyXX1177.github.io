short_bio: >-
  <p>I am pursuing a <strong>Bachelor of Engineering (Honours)</strong> at the <strong>National University of Singapore</strong>,
  with expected graduation in January 2027. My research focuses on medical image analysis,
  4D cardiac reconstruction, and anatomically consistent segmentation.</p>
  <p>At NUS, I worked in the <strong>Digital Heart Lab</strong> on whole-heart mesh reconstruction from cine MRI,
  including differentiable contour rendering and temporal modeling. During my exchange at
  <strong>Vanderbilt University</strong>, I worked in <strong>MASI</strong>
  on topology-aware orbital segmentation.</p>
